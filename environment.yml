# =============================================================================
# environment.yml — conda env definition dla algo_bot
#
# Stwórz env (jednorazowo):    conda env create -f environment.yml
# Aktywuj:                     conda activate algo_bot
# Update po zmianie pliku:     conda env update -f environment.yml --prune
# Usun:                        conda env remove -n algo_bot
#
# Po stworzeniu i aktywacji env zainstaluj pakiet algo_bot + dev deps:
#   pip install -e ".[dev]"
# albo:
#   make install
#
# UWAGA dotyczaca TA-Lib:
# TA-Lib wymaga systemowej biblioteki C (libta-lib). Conda-forge dostarcza
# OBA — system lib + Python bindings — w jednym kroku. Dlatego TA-Lib jest
# tutaj (conda), a NIE w pyproject.toml (pip). Pip-install TA-Lib bez C-libka
# pada na compile, conda-install dziala out-of-the-box.
# =============================================================================

name: algo_bot

channels:
  - conda-forge
  - defaults

dependencies:
  # Core
  - python=3.11
  - pip

  # TA-Lib (system lib + Python bindings, atomowo z conda-forge)
  - ta-lib

  # Numpy/Scipy z MKL/OpenBLAS (szybsze niz PyPI wheels dla CPU-heavy backtestow)
  # Pip zlapie je z conda env (nie reinstall) gdy uruchamiamy `pip install -e .`
  - numpy
  - pandas
  - scipy

  # Jupyter — do notebooks/ (research, walk-forward analysis)
  - jupyterlab
  - ipykernel

  # Reszta deps idzie przez pip-tools z pyproject.toml
  # (ccxt, backtesting, PyYAML, dotenv, ruff, mypy, pytest, etc.)
