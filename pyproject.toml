# =============================================================================
# pyproject.toml — algo_bot
#
# Build backend:  hatchling
# Python:         3.12 (pinned in .python-version)
# Env:            vanilla CPython managed by uv
# Lockfile:       uv.lock (requirements.txt is a compatibility export)
# Package layout: src-less, pakiet bezposrednio w algo_bot/ (po flatten)
#
# Setup od zera (jednorazowo):
#   make env           # uv sync --locked (creates .venv)
#
# Codzienna praca:
#   make test          # pytest
#   make lint          # ruff check
#   make typecheck     # mypy
#   make check         # wszystko naraz (CI-style)
#
# Po dodaniu/zmianie dependency w [project.dependencies]:
#   make lock          # regeneruje uv.lock
#   make sync          # exact sync from uv.lock
# =============================================================================

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

# === Project metadata (PEP 621) ==============================================
[project]
name = "algo_bot"
version = "0.1.0"
description = "Quantitative trading framework for crypto futures (RBI methodology)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Janek Plonski", email = "jan.plonski@redge.com"},
]
keywords = ["algorithmic-trading", "backtesting", "crypto", "binance", "rbi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# --- Runtime deps ------------------------------------------------------------
# TA-Lib >=0.6.5 publishes binary wheels containing the C library. Pin both
# engine-critical packages exactly; uv.lock pins the remaining dependency graph.
dependencies = [
    "nautilus-trader==1.230.0",
    "TA-Lib==0.7.0",
    "ccxt>=2.8.58",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "backtesting==0.6.5",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "matplotlib>=3.6.0",
]

# --- Development dependency groups ------------------------------------------
[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "pandas-stubs>=2.0.0",       # mypy potrzebuje stubow dla pandas
    "types-PyYAML>=6.0.0",       # mypy potrzebuje stubow dla yaml
]
notebooks = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
]

[project.urls]
Repository = "https://github.com/JanekPlo/algo_bot"
Issues     = "https://github.com/JanekPlo/algo_bot/issues"

# --- CLI entries =============================================================
# Po `uv sync` komendy uruchamiaj przez `uv run`, np. `uv run algo-backtest`.
# Mapping: nazwa-komendy = "modul.path:funkcja"
#
# TODO (future): dodac kolejne wpisy gdy refaktorujemy/tworzymy modul:
#   algo-live      = "algo_bot.live:main"           (po przeniesieniu live/ do algo_bot.live)
[project.scripts]
algo-backtest      = "algo_bot.engine.backtester:main"
algo-fetch         = "algo_bot.fetch_data:main"
algo-fetch-funding = "algo_bot.funding:main"  # ADR-011 (Decyzja 6)
algo-process       = "algo_bot.process_data:main"
algo-sweep         = "algo_bot.engine.sweep:main"
algo-walkforward   = "algo_bot.engine.walkforward:main"  # ADR-009 (Decyzja F)

# === Hatchling =================================================================
[tool.hatch.build.targets.wheel]
packages = ["algo_bot"]

# === Ruff (lint + format) ====================================================
# Zastepuje: black + isort + flake8 + pyupgrade (jeden tool, jedna konfig)
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notebooks/*"]   # notebooki maja wlasne zasady (jupytext)

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (undefined names, unused imports)
    "W",      # pycodestyle warnings
    "I",      # isort (import order)
    "B",      # flake8-bugbear (likely bugs)
    "UP",     # pyupgrade (modernize syntax)
    "SIM",    # flake8-simplify (idiomatic)
    "RUF",    # ruff-specific
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function call in argument defaults (legitimate w argparse)
    # Polskie znaki interpunkcyjne (en-dash, em-dash) sa legitimate w polskim tekscie.
    # W docstringach i komentarzach nie ma confusion z hyphen-minus, wiec uciszamy.
    "RUF002", # ambiguous unicode w docstringach
    "RUF003", # ambiguous unicode w komentarzach
    # RUF001 (ambiguous w IDENTIFIERS) NIE jest ignorowane — gdyby byl gdzies '–' w
    # nazwie zmiennej to bug, naprawiamy recznie.
]

[tool.ruff.lint.per-file-ignores]
"__init__.py"          = ["F401", "F403"]    # pozwol na re-exports
"algo_bot/indicators/__init__.py" = ["F401", "F403"]
"tests/**/*.py"        = ["B011"]             # asserts w testach OK
"notebooks/**/*.py"    = ["E402"]             # imports nie zawsze na gorze

[tool.ruff.lint.isort]
known-first-party = ["algo_bot"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# === Mypy (type checker, strict-on-new-modules) ==============================
# Polityka: legacy luzny, nowy kod (risk, walkforward, metrics) — pelny strict.
# Jane Street vibe bez tygodnia refaktoru legacy.
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
explicit_package_bases = true
ignore_missing_imports = true     # backtesting.py i ccxt nie maja stubow

# Default: lenient (legacy modules — bedziemy progresywnie typizowac)
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

# Strict per modul — pelny rygor TYLKO dla nowych modulow (fazy 1+).
# UWAGA: overrides dla nie-istniejacych jeszcze modulow generuja warning "unused
# section". Akceptujemy — moduly powstana w decyzjach C-F i wtedy overrides zaczyna
# obowiazywac. Mozna by przeniesc te bloki do PR ktore tworza dany modul.
[[tool.mypy.overrides]]
module = [
    "algo_bot.log",                   # decyzja C (ADR-006)
    "algo_bot.risk.*",                # decyzja E
    "algo_bot.engine.walkforward",    # decyzja F
    "algo_bot.metrics",               # decyzja D
    "algo_bot.data_integrity",        # Faza 2 Sesja 2 (Decyzja 7)
    "algo_bot.microstructure",        # Faza 2 Sesja 3 (ADR-011)
    "algo_bot.strategies.mean_reversion_bb_stoch",  # Faza 2 MR-Session Beta
    "algo_bot.engine.nautilus_oms_poc",  # MR-Session Beta P4 OMS safety proof
    "algo_bot.engine.nautilus_adapter",  # MR-Session Beta P5 Tier-1 equivalence
    "algo_bot.strategies.mastermind.*",  # MR-Session Beta P6 pure state machine
    "algo_bot.engine.backtest_result",  # MR-Session Beta P8 versioned result artifact
    "algo_bot.engine.mms_beta_data",  # MR-Session Beta P9 development-only data boundary
    "algo_bot.engine.mms_beta_benchmark",  # MR-Session Beta P9 frozen ablation runner
    "algo_bot.engine.exchanges.bybit_adapter",  # ADR-015 Bybit v5 CCXT wrapper
    "algo_bot.live.live_bybit",  # ADR-015 Bybit live runner (testnet-first)
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true

# PyO3 exports several runtime classes which its 1.230.0 type surface does not expose
# to mypy (StrategyConfig, BacktestEngine, fill/latency models). Keep every other strict
# check for the P7 wrapper and suppress only that third-party stub boundary.
[[tool.mypy.overrides]]
module = ["algo_bot.engine.nautilus_mastermind"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
disable_error_code = ["attr-defined"]

# Legacy strategies — silence attr-defined cascade z DataclassInstance.
# Powod: StrategyBase.p ma typ DataclassInstance protocol, mypy nie zna
# konkretnych pol w subklasach (np. self.p.ema_fast). Real fix to refaktor
# StrategyBase z Generic[P] — planowany jako osobny ADR przy okazji decyzji E.
# Do tego czasu wylaczamy attr-defined dla strategies/, zeby make check przechodzilo.
[[tool.mypy.overrides]]
module = ["algo_bot.strategies.*"]
disable_error_code = ["attr-defined"]

# strategy_base i backtester maja symptomy tego samego issue — symptomy ignorujemy
# selektywnie zeby nie wylaczac calego attr-defined check w tych plikach.
[[tool.mypy.overrides]]
module = ["algo_bot.strategy_base", "algo_bot.engine.backtester"]
disable_error_code = ["assignment", "operator"]

# Tlumi bledy z bibliotek bez stubow (ignore_missing_imports already default)
[[tool.mypy.overrides]]
module = [
    "backtesting.*",
    "ccxt.*",
    "talib.*",
]
ignore_errors = true
ignore_missing_imports = true

# === uv =====================================================================
[tool.uv]
required-version = "==0.11.28"
prerelease = "disallow"
python-preference = "managed"

# === Pytest =================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: testy wolne (deselect z '-m \"not slow\"')",
    "integration: wymaga zewnetrznych serwisow (network, plikow)",
    "live: testy zwiazane z live tradingiem (testnet)",
]

# === Coverage ===============================================================
[tool.coverage.run]
source = ["algo_bot"]
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/notebooks/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
