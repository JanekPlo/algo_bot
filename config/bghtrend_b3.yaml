slope_thr_mid:  {type: float, min: 0.00003, max: 0.00008, step: 0.00001}
slope_thr_slow: {type: float, min: 0.00002, max: 0.00005, step: 0.000005}

deadzone:      {type: choice, values: [1.5, 2.0, 3.0]}

pullback_lookback:  {type: choice, values: [8, 12, 15]}
