# Implied timeframe: 1h (mr_b2 = MR RELAXED; patrz docs/reference/modules/strategy-mean-reversion-bb-stoch.md)
# Oś selektywności: b2 permissive — płytsze wstęgi (więcej dotknięć), entry_mode
# sweepowany {bb_only, bb_stoch} (decyzja sesji: Stoch jako wymiar sweepa),
# dłuższe okno reakcji, luźniejsze progi Stocha. Więcej trade'ów niż b1.
__implied_tf: "1h"
__mode: random
__n: 30
__seed: 202

bb_window:  {type: choice, values: [15, 20, 25]}
bb_num_std: {type: float, min: 1.5, max: 2.0, step: 0.1}

stoch_k:          {type: choice, values: [14]}
stoch_d:          {type: choice, values: [3]}
stoch_smooth:     {type: choice, values: [3]}
stoch_oversold:   {type: choice, values: [20.0, 25.0]}
stoch_overbought: {type: choice, values: [75.0, 80.0]}

# entry_mode sweepowany — b2 rozstrzyga empirycznie czy Stoch dokłada edge
entry_mode:      {type: choice, values: ["bb_only", "bb_stoch"]}
arm_expiry_bars: {type: choice, values: [2, 3, 4]}
require_reclaim: {type: choice, values: [false]}

sl_pct:          {type: float, min: 0.015, max: 0.030, step: 0.005}
tp_has_priority: {type: choice, values: [false]}

side:           {type: choice, values: ["both"]}
trade_on_close: {type: choice, values: [true]}
