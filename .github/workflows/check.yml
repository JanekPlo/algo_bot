name: check

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check:
    name: make check
    # Nautilus 1.230.0 officially supports Ubuntu 22.04+ / glibc 2.35+.
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12.13"
          enable-cache: true

      - name: Install package
        run: uv sync --locked

      - name: Run quality gate
        run: make check
